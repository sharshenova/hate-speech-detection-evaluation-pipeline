prompt_id: ghc-few-shot-detailed
name: GHC few-shot - Detailed
description: 'Detailed GHC definition plus five paraphrased examples from difficult
  train cases (VO-only non-hate, HD political dehumanization, CV incitement). Examples
  are fixed for every dev post.

  '
dataset: ghc
eval_split: dev
text_placeholder: '{text}'
few_shot_examples:
- source_post_id: 5767
  category: plain_non_hate
  post: Please join this platform - we saved an account for you.
  label: non-hate
  selection_note: Neutral invite; no insult or group attack.
- source_post_id: 26639
  category: vo_only_individual_insult
  post: 'Daily reminder: that TV host is pathetic and weak.'
  label: non-hate
  selection_note: Vulgar personal insult at a named individual; VO-only, not HD/CV.
- source_post_id: 5340
  category: vo_only_profanity
  post: Congratulations - this is a damn badge of honor!
  label: non-hate
  selection_note: Profanity without group target; common false-positive pattern for
    LLMs.
- source_post_id: 8723
  category: hd_political_dehumanization
  post: Members of the opposing party are vile, traitorous garbage.
  label: hate
  selection_note: Dehumanizing attack on a political group (HD); political hate in
    scope.
- source_post_id: 27384
  category: cv_political_violence
  post: Politicians who lie should be shot by ordinary gun owners.
  label: hate
  selection_note: Explicit call for violence against a group (CV).
messages:
  system: 'You are a hate speech classifier. Apply the coding rules exactly. Do not
    treat

    general offensiveness or profanity as hate unless the rules below say so.

    You must always answer with exactly one word: hate or non-hate. Never refuse to
    classify.

    '
  user: "Classify social media posts using the **strict Gab Hate Corpus (GHC) definition**\n\
    used in this project.\n\nA post is **hate** if and only if it contains at least\
    \ one of:\n\n1. **Dehumanizing rhetoric (HD)** - an assault on human dignity targeting\
    \ a social\n   group (or an individual because of group membership), such as:\n\
    \   - asserting or implying group inferiority (intelligence, genetics, capacity,\
    \ etc.);\n   - degrading or dehumanizing a group (e.g. comparing to animals or\
    \ subhuman entities or using hateful slurs intended to harm);\n   - inciting hatred\
    \ via harmful stereotypes, historical or political references, or\n     endorsement\
    \ of hate groups or ideologies.\n\n2. **Call for violence (CV)** - explicit advocacy,\
    \ incitement, or endorsement of\n   violence against a group, or against someone\
    \ because of their group membership.\n\nProtected group identities include race,\
    \ ethnicity, religion, nationality/regionalism,\nideology, gender, sexual orientation,\
    \ political identification, mental/physical ability.\n\nA post is **non-hate**\
    \ if it does not meet HD or CV, including:\n\n- **Offensive or vulgar language\
    \ alone (VO)** - insults, profanity, or slurs that are\n  not a group-level attack\
    \ and do not dehumanize or call for violence.\n- Rude or offensive content that\
    \ is not dehumanizing and does not call for violence.\n\n**Political hate** (attacks\
    \ on people or groups because of political affiliation or\nideology) counts as\
    \ hate when it meets HD or CV.\n\nStudy these labeled examples:\n\n{few_shot_block}\n\
    \nNow classify the following post:\n\nPost:\n{text}\n\nAnswer with exactly one\
    \ word: hate or non-hate.\n"
output:
  format: single_token
  valid_labels:
  - hate
  - non-hate
  parse_as_hate:
  - hate
  - 'yes'
  parse_as_non_hate:
  - non-hate
  - nonhate
  - not hate
  - 'no'
