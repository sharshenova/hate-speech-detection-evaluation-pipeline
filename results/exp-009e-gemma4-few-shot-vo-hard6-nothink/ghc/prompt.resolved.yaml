prompt_id: ghc-few-shot-short-6x6
name: GHC few-shot - Short GHC + 6/6
description: 'Same Short GHC rule as exp-007d / 009b, with 6 hate + 6 non-hate
  train examples (interleaved). Designed for Gemma without thinking so answers stay
  one-word.

  '
dataset: ghc
eval_split: dev
text_placeholder: '{text}'
few_shot_examples_path: data/processed/ghc/hard_errors/ghc_few_shot_hard_examples_6x6.yaml
few_shot_interleave: true
messages:
  system: 'You classify social media posts. Reply with exactly one word: hate or non-hate.

    Do not explain. Do not restate the examples.

    '
  user: 'Study these labeled examples, then classify the new post.


    {few_shot_block}


    Post:

    {text}


    Is this hate speech? Hate speech attacks, dehumanizes, or calls for violence

    against a person or group based on a protected characteristic (such as race,

    ethnicity, religion, nationality, gender, sexual orientation, disability, or

    political ideology). Offensive or profane language alone is NOT hate speech

    unless it contains such a group-based attack.


    Answer with exactly one word: hate or non-hate.

    '
output:
  format: single_token
  valid_labels:
  - hate
  - non-hate
  parse_as_hate:
  - hate
  - true
  parse_as_non_hate:
  - non-hate
  - nonhate
  - not hate
  - false
