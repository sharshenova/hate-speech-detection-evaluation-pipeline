# fBERT sequence classifier - domain-adapted offensive-language encoder.
# Requires: pip install -e ".[dev,ml]"
# Run: python scripts/training/train.py --config configs/exp-003-fbert.yaml
# Base settings are MPS-friendly (8GB Apple Silicon); the cuda block applies on GPU hosts.

experiment_id: exp-003-fbert
dataset: ghc
seed: 42

data:
  text_column: text
  label_column: hate

model:
  type: fbert_sequence_classifier
  pretrained_name: diptanu/fBERT
  # auto = CUDA if available, else Apple MPS, else CPU. Override with cuda/mps/cpu.
  device: auto
  max_length: 128
  learning_rate: 5.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.10
  batch_size: 4
  gradient_accumulation_steps: 4
  epochs: 3
  class_weight: balanced
  max_grad_norm: 1.0
  gradient_checkpointing: true
  train_eval_sample: 5000
  # Applied automatically when device is CUDA (MPS/CPU keep settings above).
  cuda:
    batch_size: 64
    gradient_accumulation_steps: 1
    gradient_checkpointing: false
    num_workers: 8
    pin_memory: true
    bf16: true
  early_stopping:
    enabled: true
    patience: 1
    metric: macro_f1

training:
  primary_metric: macro_f1
  threshold_tuning:
    enabled: true
    split: dev
    metric: macro_f1
    min_threshold: 0.05
    max_threshold: 0.95
    step: 0.01

results_dir: results/exp-003-fbert
