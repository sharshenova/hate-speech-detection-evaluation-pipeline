# LoRA classification prompt - DGHD combined (identity axes + adversarial/generated).
# Merges dghd-lora-classify adversarial clause with dghd-lora-classify-identity axes.
# Used by exp-015 Qwen3.5-9B.

prompt_id: dghd-lora-classify-combined
dataset: dghd

messages:
  system: |
    You classify social media posts for hate speech. Answer only hate or non-hate.
  user: |
    A post is hate if it expresses hatred toward a person or group based on identity
    or protected characteristics, such as race, national or ethnic origin, immigration
    status, religion, gender, gender identity, sexual orientation, disability,
    class, or age. This includes adversarial or generated hate examples.

    Post:
    {text}

    Answer with exactly one word: hate or non-hate.

output:
  parse_as_hate:
    - hate
    - "yes"
  parse_as_non_hate:
    - non-hate
    - nonhate
    - not hate
    - "no"
