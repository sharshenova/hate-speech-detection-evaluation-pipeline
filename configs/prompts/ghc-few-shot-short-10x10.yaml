# Few-shot - Short GHC + 10/10 hard train examples (original texts).
# Examples live under data/ (gitignored) so raw hate text is not committed.
# Intended model: gemma4:12b (Ollama) with thinking enabled in the experiment config.

prompt_id: ghc-few-shot-short-10x10
name: GHC few-shot - Short GHC + 10/10
description: >
  Same Short GHC rule as exp-007d, plus 10 hate and 10 non-hate GHC train
  examples mined from QLoRA hard errors / labeled train (see few_shot_examples_path).

dataset: ghc
eval_split: dev
text_placeholder: "{text}"

few_shot_examples_path: data/processed/ghc/hard_errors/ghc_few_shot_hard_examples_10x10.yaml

messages:
  system: |
    You classify social media posts. Answer only with the requested label.
  user: |
    Study these labeled examples:

    {few_shot_block}

    Now classify the following post.

    Post:
    {text}

    Is this hate speech? Hate speech attacks, dehumanizes, or calls for violence
    against a person or group based on a protected characteristic (such as race,
    ethnicity, religion, nationality, gender, sexual orientation, disability, or
    political ideology). Offensive or profane language alone is NOT hate speech
    unless it contains such a group-based attack.

    Answer with exactly one word: hate or non-hate.

output:
  format: single_token
  valid_labels:
    - hate
    - non-hate
  parse_as_hate:
    - hate
    - yes
  parse_as_non_hate:
    - non-hate
    - nonhate
    - not hate
    - no
