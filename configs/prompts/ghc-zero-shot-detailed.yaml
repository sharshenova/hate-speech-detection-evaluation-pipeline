# Zero-shot prompt - Detailed GHC binary hate definition.
# hate = 1 iff dehumanizing (hd) OR call for violence (cv).
# Offensive/vulgar (vo) alone -> non-hate. Political hate in scope when hd/cv.
# Intended model: meta-llama/Llama-3.2-3B-Instruct

prompt_id: ghc-zero-shot-detailed
name: GHC zero-shot - Detailed
description: >
  Full Gab Hate Corpus coding rules as used in this thesis.
  Matches supervised GHC training labels: hd=1 OR cv=1 -> hate; vo-only -> non-hate.

dataset: ghc
eval_split: dev
text_placeholder: "{text}"

messages:
  system: |
    You are a hate speech classifier. Apply the coding rules exactly. Do not treat
    general offensiveness or profanity as hate unless the rules below say so.
  user: |
    Classify this social media post using the **strict Gab Hate Corpus (GHC) definition**
    used in this project.

    A post is **hate** if and only if it contains at least one of:

    1. **Dehumanizing rhetoric (HD)** - an assault on human dignity targeting a social
       group (or an individual because of group membership), such as:
       - asserting or implying group inferiority (intelligence, genetics, capacity, etc.);
       - degrading or dehumanizing a group (e.g. comparing to animals or subhuman entities or using hateful slurs intended to harm);
       - inciting hatred via harmful stereotypes, historical or political references, or
         endorsement of hate groups or ideologies.

    2. **Call for violence (CV)** - explicit advocacy, incitement, or endorsement of
       violence against a group, or against someone because of their group membership.
        
    Protected group identities include race, ethnicity, religion, nationality/regionalism, ideology, gender, sexual orientation, political identification, mental/physical ability. 
    
    A post is **non-hate** if it does not meet HD or CV, including:

    - **Offensive or vulgar language alone (VO)** - insults, profanity, or slurs that are
      not a group-level attack and do not dehumanize or call for violence.
    - Rude or offensive content that is not dehumanizing and does not call for violence.

    **Political hate** (attacks on people or groups because of political affiliation or
    ideology) counts as hate when it meets HD or CV.

    Post:
    {text}

    Answer with exactly one word: hate or non-hate.

output:
  format: single_token
  valid_labels:
    - hate
    - non-hate
  parse_as_hate:
    - hate
    - yes
  parse_as_non_hate:
    - non-hate
    - nonhate
    - not hate
    - no
