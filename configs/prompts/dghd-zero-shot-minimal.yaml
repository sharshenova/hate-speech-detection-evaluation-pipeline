# Zero-shot prompt - minimal (no label definition). DGHD-adapted from GHC 007a/009a.

prompt_id: dghd-zero-shot-minimal
name: DGHD zero-shot - minimal
description: >
  Vague hate-speech question with no coding rules. Baseline for Gemma on DGHD.

dataset: dghd
eval_split: dev
text_placeholder: "{text}"

messages:
  system: |
    You classify social media posts. Answer only with the requested label.
  user: |
    Post:
    {text}

    Is this hate speech? Answer with exactly one word: hate or non-hate.

output:
  format: single_token
  valid_labels:
    - hate
    - non-hate
  parse_as_hate:
    - hate
    - yes
  parse_as_non_hate:
    - non-hate
    - nonhate
    - not hate
    - no
