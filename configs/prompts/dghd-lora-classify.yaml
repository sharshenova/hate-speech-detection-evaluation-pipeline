# LoRA classification prompt - DGHD binary hate label.

prompt_id: dghd-lora-classify
dataset: dghd

messages:
  system: |
    You classify social media posts for hate speech. Answer only hate or non-hate.
  user: |
    A post is hate if it expresses hatred toward a person or group based on identity
    or protected characteristics, including adversarial or generated hate examples.

    Post:
    {text}

    Answer with exactly one word: hate or non-hate.

output:
  parse_as_hate:
    - hate
    - "yes"
  parse_as_non_hate:
    - non-hate
    - nonhate
    - not hate
    - "no"
