# DeBERTa-v3-large at best base LR 2e-5 (GHC/KTC). Smaller CUDA batch + grad accum for VRAM.
# Run: python scripts/training/train.py --config configs/exp-005a-deberta-large-lr2e-5.yaml --dataset {ghc|ktc}

experiment_id: exp-005a-deberta-large-lr2e-5
dataset: ghc
seed: 42

data:
  text_column: text
  label_column: hate

model:
  type: deberta_sequence_classifier
  pretrained_name: microsoft/deberta-v3-large
  device: auto
  max_length: 128
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  batch_size: 2
  gradient_accumulation_steps: 8
  epochs: 3
  class_weight: balanced
  max_grad_norm: 1.0
  gradient_checkpointing: true
  train_eval_sample: 5000
  cuda:
    batch_size: 8
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
    num_workers: 4
    pin_memory: true
    bf16: false
  early_stopping:
    enabled: true
    patience: 1
    metric: macro_f1

training:
  primary_metric: macro_f1
  threshold_tuning:
    enabled: true
    split: dev
    metric: macro_f1
    min_threshold: 0.05
    max_threshold: 0.95
    step: 0.01

results_dir: results/exp-005a-deberta-large-lr2e-5
