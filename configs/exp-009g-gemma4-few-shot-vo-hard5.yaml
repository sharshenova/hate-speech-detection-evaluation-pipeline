# Gemma 4 12B on GHC dev - Short GHC + 5/5 hard few-shot, thinking ON.
# Refined from 009e 6/6: drop weak hate CV (7175); drop weak non-hate (3426, 25395);
# add gold non-hate Islam-ideology critique (21139). Large max_new_tokens for think.
# Run: python scripts/training/eval_zero_shot.py --config configs/exp-009g-gemma4-few-shot-vo-hard5.yaml

experiment_id: exp-009g-gemma4-few-shot-vo-hard5
dataset: ghc
seed: 42
eval_split: dev

prompt_config: configs/prompts/ghc-few-shot-short-5x5.yaml

data:
  text_column: text
  label_column: hate

model:
  type: ollama_chat
  name_or_path: gemma4:12b
  base_url: http://127.0.0.1:11435
  enable_thinking: true
  think: true
  # Room for thinking without truncating into example dumps (009d failure mode).
  max_new_tokens: 2048
  temperature: 0
  request_timeout_s: 300
  log_every: 50

results_dir: results/exp-009g-gemma4-few-shot-vo-hard5
