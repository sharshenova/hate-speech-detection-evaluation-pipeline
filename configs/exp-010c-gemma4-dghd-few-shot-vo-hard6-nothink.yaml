# Gemma 4 12B on DGHD dev - Short DGHD + 6/6 train few-shot, thinking OFF.
# Run: python scripts/training/eval_zero_shot.py --config configs/exp-010c-gemma4-dghd-few-shot-vo-hard6-nothink.yaml

experiment_id: exp-010c-gemma4-dghd-few-shot-vo-hard6-nothink
dataset: dghd
seed: 42
eval_split: dev

prompt_config: configs/prompts/dghd-few-shot-short-6x6.yaml

data:
  text_column: text
  label_column: hate

model:
  type: ollama_chat
  name_or_path: gemma4:12b
  base_url: http://127.0.0.1:11435
  enable_thinking: false
  think: false
  max_new_tokens: 16
  temperature: 0
  stop:
    - "\n"
  request_timeout_s: 120
  log_every: 50

results_dir: results/exp-010c-gemma4-dghd-few-shot-vo-hard6-nothink
