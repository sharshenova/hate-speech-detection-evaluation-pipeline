# Gemma 4 12B on GHC dev - Short GHC + 6/6 hard few-shot, thinking OFF.
# Follow-up to exp-009d (10/10 + think collapsed hate recall via truncated thoughts).
# Run: python scripts/training/eval_zero_shot.py --config configs/exp-009e-gemma4-few-shot-vo-hard6-nothink.yaml

experiment_id: exp-009e-gemma4-few-shot-vo-hard6-nothink
dataset: ghc
seed: 42
eval_split: dev

prompt_config: configs/prompts/ghc-few-shot-short-6x6.yaml

data:
  text_column: text
  label_column: hate

model:
  type: ollama_chat
  name_or_path: gemma4:12b
  base_url: http://127.0.0.1:11435
  enable_thinking: false
  think: false
  # No thinking: keep generation short so the model must emit the label.
  max_new_tokens: 16
  temperature: 0
  stop:
    - "\n"
  request_timeout_s: 120
  log_every: 50

results_dir: results/exp-009e-gemma4-few-shot-vo-hard6-nothink
