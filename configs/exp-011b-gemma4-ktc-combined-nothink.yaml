# Gemma 4 12B on KTC dev - Short KTC, thinking OFF.
# Run: python scripts/training/eval_zero_shot.py --config configs/exp-011b-gemma4-ktc-combined-nothink.yaml

experiment_id: exp-011b-gemma4-ktc-combined-nothink
dataset: ktc
seed: 42
eval_split: dev

prompt_config: configs/prompts/ktc-zero-shot-short.yaml

data:
  text_column: text
  label_column: hate

model:
  type: ollama_chat
  name_or_path: gemma4:12b
  base_url: http://127.0.0.1:11435
  enable_thinking: false
  think: false
  max_new_tokens: 16
  temperature: 0
  stop:
    - "\n"
  request_timeout_s: 120
  log_every: 50

results_dir: results/exp-011b-gemma4-ktc-combined-nothink
