# Gemma 4 12B + think on GHC dev - Short GHC (same text as Llama exp-007d).
# Run: python scripts/training/eval_zero_shot.py --config configs/exp-009b-gemma4-vo-note.yaml

experiment_id: exp-009b-gemma4-vo-note
dataset: ghc
seed: 42
eval_split: dev

prompt_config: configs/prompts/ghc-zero-shot-short.yaml

data:
  text_column: text
  label_column: hate

model:
  type: ollama_chat
  name_or_path: gemma4:12b
  base_url: http://127.0.0.1:11435
  enable_thinking: true
  think: true
  max_new_tokens: 512
  temperature: 0
  request_timeout_s: 300
  log_every: 50

results_dir: results/exp-009b-gemma4-vo-note
