[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsd"
version = "0.1.0"
description = "Hate speech detection evaluation pipeline - Master's thesis project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
ml = [
    "transformers>=5.14.0,<6.0",  # Qwen3.5 (Qwen3_5ForCausalLM)
    "torch>=2.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20",
]
lora = [
    "peft>=0.14",
    "bitsandbytes>=0.43",  # optional: only needed when model.qlora=true
    "accelerate>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
